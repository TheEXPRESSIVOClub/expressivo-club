<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expressivo Club - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { initializeFirestore, collection, doc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHvyRDPEG9jzFbqSTuKmTjvnRDShmN6uU",
            authDomain: "expressivo-club.firebaseapp.com",
            projectId: "expressivo-club",
            storageBucket: "expressivo-club.firebasestorage.app",
            messagingSenderId: "562055940468",
            appId: "1:562055940468:web:6691f8ad3a87954d660421"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, {
            experimentalAutoDetectLongPolling: true
        });

        window.db = db;
        window.adminData = { students: [], families: {}, workshops: [], vouchers: [] };

        function initAdmin() {
            // Listen to Students
            onSnapshot(collection(db, "students"), (snapshot) => {
                window.adminData.students = [];
                snapshot.forEach(d => window.adminData.students.push({ id: d.id, ...d.data() }));
                renderStudents();
                populateDropdowns();
            });

            // Listen to Families
            onSnapshot(collection(db, "families"), (snapshot) => {
                window.adminData.families = {};
                snapshot.forEach(d => {
                    window.adminData.families[d.id] = d.data();
                });
                renderFamilies();
                populateDropdowns();
            });

            // Listen to Workshops
            onSnapshot(collection(db, "workshops"), (snapshot) => {
                window.adminData.workshops = [];
                snapshot.forEach(d => window.adminData.workshops.push({ id: d.id, ...d.data() }));
                renderWorkshops();
                populateDropdowns();
            });

            // Listen to Vouchers
            onSnapshot(collection(db, "vouchers"), (snapshot) => {
                window.adminData.vouchers = [];
                snapshot.forEach(d => window.adminData.vouchers.push({ id: d.id, ...d.data() }));
                renderVouchers();
            });
        }

        function populateDropdowns() {
            const studentSelect = document.getElementById('admin-book-student');
            const workshopSelect = document.getElementById('admin-book-workshop');
            if (!studentSelect || !workshopSelect) return;

            studentSelect.innerHTML = `<option value="">-- Select Student --</option>` + 
                window.adminData.students.map(s => `<option value="${s.id}">${s.name} (Family: ${s.family})</option>`).join('');

            workshopSelect.innerHTML = `<option value="">-- Select Workshop --</option>` + 
                window.adminData.workshops.map(w => `<option value="${w.id}">${w.title} (RM ${w.price})</option>`).join('');
        }

        window.adminProcessBooking = async function() {
            const studentId = document.getElementById('admin-book-student').value;
            const workshopId = document.getElementById('admin-book-workshop').value;
            const customDiscount = parseFloat(document.getElementById('admin-custom-discount').value) || 0;

            if (!studentId || !workshopId) {
                alert("Please select both a student and a workshop.");
                return;
            }

            const student = window.adminData.students.find(s => s.id === studentId);
            const workshop = window.adminData.workshops.find(w => w.id === workshopId);
            if (!student || !workshop) return;

            const familyId = student.family;
            const family = window.adminData.families[familyId] || { wallet: 0, stars: 100, tier: 'Prelude' };

            let basePrice = parseFloat(workshop.price) || 0;
            let tier = family.tier || 'Prelude';
            let tierDiscountRate = 0;

            if (tier === 'Crescendo') tierDiscountRate = 0.05;
            if (tier === 'Virtuoso') tierDiscountRate = 0.10;

            let priceAfterTier = basePrice * (1 - tierDiscountRate);
            let finalPrice = Math.max(0, priceAfterTier - customDiscount);
            const currentWallet = Number(family.wallet || 0);

            if (currentWallet < finalPrice) {
                alert(`Insufficient family wallet balance! Required: RM ${finalPrice.toFixed(2)}, Available: RM ${currentWallet.toFixed(2)}`);
                return;
            }

            const starsEarned = Math.floor(finalPrice / 2);

            try {
                // 1. Add student to workshop registered list
                const registeredList = workshop.registered || [];
                if (!registeredList.includes(student.name)) {
                    registeredList.push(student.name);
                    await updateDoc(doc(db, "workshops", workshopId), { registered: registeredList });
                }

                // 2. Deduct wallet & add stars
                const newWallet = currentWallet - finalPrice;
                const newStars = Number(family.stars || 100) + starsEarned;

                await setDoc(doc(db, "families", familyId), {
                    ...family,
                    wallet: newWallet,
                    stars: newStars
                }, { merge: true });

                // 3. Add transaction log
                await addDoc(collection(db, "transactions"), {
                    date: new Date().toISOString().split('T')[0],
                    student: student.name,
                    family: familyId,
                    desc: `Admin Booked: ${workshop.title} (Discount: RM ${customDiscount.toFixed(2)})`,
                    amount: `- RM ${finalPrice.toFixed(2)}`,
                    starsChange: `+${starsEarned} ⭐`
                });

                alert(`Successfully processed booking for ${student.name}! Deducted RM ${finalPrice.toFixed(2)} from family wallet.`);
                document.getElementById('admin-custom-discount').value = '';
            } catch (err) {
                console.error("Booking error:", err);
                alert("Error processing booking.");
            }
        };

        // Student registration form handler
        window.registerStudent = async function(e) {
            e.preventDefault();
            const name = document.getElementById('student-name').value;
            const contact = document.getElementById('student-contact').value;
            const family = document.getElementById('student-family').value;

            try {
                await addDoc(collection(db, "students"), { name, contact, family });
                
                // Ensure family document exists
                const famRef = doc(db, "families", family);
                await setDoc(famRef, {
                    wallet: 50.00, // Starting welcome credit or 0
                    stars: 100,
                    tier: 'Prelude'
                }, { merge: true });

                alert("Student added successfully & Family account initialized!");
                e.target.reset();
            } catch (err) {
                console.error("Error adding student: ", err);
                alert("Error saving student.");
            }
        };

        function renderStudents() {
            const container = document.getElementById('students-table-body');
            if (!container) return;
            container.innerHTML = window.adminData.students.map(s => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-3 font-bold">${s.name}</td>
                    <td class="p-3">${s.contact}</td>
                    <td class="p-3"><span class="px-2 py-1 bg-indigo-50 text-indigo-700 font-semibold rounded">${s.family}</span></td>
                    <td class="p-3 text-right">
                        <button onclick="deleteStudent('${s.id}')" class="text-rose-600 font-bold hover:underline">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        window.deleteStudent = async function(id) {
            if (confirm("Are you sure you want to delete this student?")) {
                await deleteDoc(doc(db, "students", id));
            }
        };

        function renderFamilies() {
            const container = document.getElementById('families-list');
            if (!container) return;
            container.innerHTML = Object.entries(window.adminData.families).map(([id, fam]) => `
                <div class="bg-slate-50 p-4 rounded-xl border flex justify-between items-center text-xs">
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">Family ID: ${id}</h4>
                        <p class="text-slate-500 mt-0.5">Tier: <span class="font-bold text-indigo-600">${fam.tier || 'Prelude'}</span> | Stars: <span class="font-bold text-amber-600">${fam.stars || 100} ⭐</span></p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-extrabold text-slate-900">RM ${Number(fam.wallet || 0).toFixed(2)}</p>
                        <button onclick="topUpWallet('${id}')" class="mt-1 px-3 py-1 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700">Top Up Wallet</button>
                    </div>
                </div>
            `).join('');
        }

        window.topUpWallet = async function(familyId) {
            const amount = prompt("Enter top-up amount in RM:");
            if (amount && !isNaN(amount)) {
                const fam = window.adminData.families[familyId] || { wallet: 0 };
                const newWallet = Number(fam.wallet || 0) + parseFloat(amount);
                await updateDoc(doc(db, "families", familyId), { wallet: newWallet });
                
                await addDoc(collection(db, "transactions"), {
                    date: new Date().toISOString().split('T')[0],
                    student: `Family Top-Up (${familyId})`,
                    family: familyId,
                    desc: `Wallet Top-Up by Admin`,
                    amount: `+ RM ${parseFloat(amount).toFixed(2)}`,
                    starsChange: `0 ⭐`
                });
                alert(`Top-up successful! New balance: RM ${newWallet.toFixed(2)}`);
            }
        };

        function renderWorkshops() {
            const container = document.getElementById('workshops-list');
            if (!container) return;
            container.innerHTML = window.adminData.workshops.map(w => `
                <div class="bg-slate-50 p-4 rounded-xl border flex justify-between items-center text-xs">
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">${w.title} - RM ${w.price}</h4>
                        <p class="text-slate-500">Registered: ${(w.registered || []).join(', ') || 'None'}</p>
                    </div>
                    <button onclick="deleteWorkshop('${w.id}')" class="text-rose-600 font-bold hover:underline">Delete</button>
                </div>
            `).join('');
        }

        window.deleteWorkshop = async function(id) {
            if (confirm("Delete workshop?")) await deleteDoc(doc(db, "workshops", id));
        };

        window.createWorkshop = async function(e) {
            e.preventDefault();
            const title = document.getElementById('ws-title').value;
            const price = document.getElementById('ws-price').value;
            const date = document.getElementById('ws-date').value;

            await addDoc(collection(db, "workshops"), { title, price, date, registered: [], status: 'Open' });
            alert("Workshop created!");
            e.target.reset();
        };

        function renderVouchers() {
            const container = document.getElementById('vouchers-list');
            if (!container) return;
            container.innerHTML = window.adminData.vouchers.map(v => `
                <div class="bg-slate-50 p-3 rounded-xl border flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold">${v.title} (${v.cost} ⭐)</p>
                        <p class="text-slate-500">Claimed by: ${v.claimedBy} (Family: ${v.family}) - Status: <span class="text-amber-600 font-bold">${v.status}</span></p>
                    </div>
                    <div>
                        ${v.status === 'Pending Verification' ? `<button onclick="approveVoucher('${v.id}', '${v.family}', '${v.title}')" class="px-3 py-1.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700">Approve Voucher</button>` : `<span class="text-emerald-600 font-bold">Approved ✓</span>`}
                    </div>
                </div>
            `).join('');
        }

        window.approveVoucher = async function(vId, familyId, title) {
            await updateDoc(doc(db, "vouchers", vId), { status: 'Approved' });
            alert(`Voucher "${title}" approved for family ${familyId}! Staff can now apply manual discounts when booking.`);
        };

        window.onload = initAdmin;
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="bg-slate-900 text-white p-6 rounded-2xl shadow-lg">
            <h1 class="text-2xl font-bold">🎹 Expressivo Club - Admin Dashboard</h1>
            <p class="text-xs text-indigo-300 mt-1">Manage students, wallets, manual workshop bookings, and vouchers.</p>
        </header>

        <!-- MANUAL WORKSHOP BOOKING & VOUCHER DEDUCTION SECTION -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b pb-3">🎟️ Admin Workshop Booking & Voucher Deduction</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Select Student</label>
                    <select id="admin-book-student" class="w-full p-2.5 border rounded-xl bg-slate-50 font-semibold"></select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Select Workshop</label>
                    <select id="admin-book-workshop" class="w-full p-2.5 border rounded-xl bg-slate-50 font-semibold"></select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Voucher / Extra Discount (RM)</label>
                    <input type="number" id="admin-custom-discount" placeholder="e.g. 5 or 10" class="w-full p-2.5 border rounded-xl bg-slate-50 font-semibold">
                </div>
            </div>
            <button onclick="adminProcessBooking()" class="w-full py-3 bg-indigo-600 text-white font-bold text-xs rounded-xl hover:bg-indigo-700 transition">Process Booking & Deduct Family Wallet</button>
        </div>

        <!-- ADD STUDENT -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b pb-3">Add New Student</h2>
            <form onsubmit="registerStudent(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                <input type="text" id="student-name" placeholder="Student Name" required class="p-2.5 border rounded-xl">
                <input type="text" id="student-contact" placeholder="Contact Number" required class="p-2.5 border rounded-xl">
                <input type="text" id="student-family" placeholder="Family Group ID (e.g. fam_tan)" required class="p-2.5 border rounded-xl">
                <button type="submit" class="sm:col-span-3 py-2.5 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition">Add Student & Initialize Family Account</button>
            </form>
        </div>

        <!-- CREATE WORKSHOP -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b pb-3">Create New Workshop</h2>
            <form onsubmit="createWorkshop(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                <input type="text" id="ws-title" placeholder="Workshop Title" required class="p-2.5 border rounded-xl">
                <input type="number" step="0.01" id="ws-price" placeholder="Price (RM)" required class="p-2.5 border rounded-xl">
                <input type="date" id="ws-date" required class="p-2.5 border rounded-xl">
                <button type="submit" class="sm:col-span-3 py-2.5 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition">Publish Workshop</button>
            </form>
        </div>

        <!-- FAMILIES WALLET LIST -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b pb-3">Family Wallets & Balances</h2>
            <div id="families-list" class="space-y-3"></div>
        </div>

        <!-- VOUCHERS LIST -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b pb-3">Pending Parent Star Redemptions</h2>
            <div id="vouchers-list" class="space-y-3"></div>
        </div>

        <!-- STUDENTS LIST -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b pb-3">Student Directory</h2>
            <table class="w-full text-left text-xs">
                <thead>
                    <tr class="border-b text-slate-400">
                        <th class="p-3">Name</th>
                        <th class="p-3">Contact</th>
                        <th class="p-3">Family ID</th>
                        <th class="p-3 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="students-table-body"></tbody>
            </table>
        </div>
    </div>
</body>
</html>
