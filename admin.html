<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expressivo Club - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 sm:p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-slate-900 text-white p-6 rounded-2xl shadow-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">🎹 Expressivo Club - Admin Portal</h1>
                <p class="text-xs text-slate-400 mt-1">Manage Students, Family Wallets, Workshops, and Vouchers</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="resetSystemData()" class="px-4 py-2 bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/50 text-rose-300 rounded-xl text-xs font-bold transition">Reset Demo Data</button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex bg-white p-2 rounded-xl shadow-sm border space-x-2 text-xs sm:text-sm font-semibold overflow-x-auto">
            <button onclick="switchAdminTab('students')" id="admin-tab-students" class="px-4 py-2 bg-slate-900 text-white rounded-lg whitespace-nowrap">🎓 Students & Families</button>
            <button onclick="switchAdminTab('workshops')" id="admin-tab-workshops" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg whitespace-nowrap">📅 Manage Workshops</button>
            <button onclick="switchAdminTab('vouchers')" id="admin-tab-vouchers" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg whitespace-nowrap">🎁 Voucher Approvals</button>
            <button onclick="switchAdminTab('transactions')" id="admin-tab-transactions" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg whitespace-nowrap">📜 System Audit Log</button>
        </div>

        <!-- TAB 1: STUDENTS & FAMILIES -->
        <div id="admin-content-students" class="space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Add Student Form -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4 h-fit">
                    <h2 class="text-base font-bold text-slate-800 border-b pb-3">➕ Register New Student</h2>
                    <form onsubmit="handleAddNewStudent(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Student Full Name</label>
                            <input type="text" id="new-student-name" required placeholder="e.g. Chloe Tan" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Family Group ID / Name</label>
                            <input type="text" id="new-family-id" required placeholder="e.g. family_1 or Tan Family" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Contact Number</label>
                            <input type="text" id="new-student-contact" required placeholder="+6012-3456789" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Membership Tier</label>
                            <select id="new-family-tier" class="w-full p-2.5 border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="Prelude">Prelude (Basic)</option>
                                <option value="Ensemble">Ensemble (Silver)</option>
                                <option value="Crescendo">Crescendo (Gold)</option>
                                <option value="Virtuoso">Virtuoso (Platinum)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Initial Wallet Credit (RM)</label>
                            <input type="number" id="new-family-wallet" value="100.00" step="0.01" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition">Save & Create Student</button>
                    </form>
                </div>

                <!-- Existing Students List & Quick Actions -->
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                    <h2 class="text-base font-bold text-slate-800 border-b pb-3">👥 Active Student Directory</h2>
                    <div id="admin-students-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- TAB 2: WORKSHOPS -->
        <div id="admin-content-workshops" class="hidden space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Create Workshop Form -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4 h-fit">
                    <h2 class="text-base font-bold text-slate-800 border-b pb-3">➕ Schedule Masterclass</h2>
                    <form onsubmit="handleCreateWorkshop(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Workshop Title</label>
                            <input type="text" id="ws-title" required placeholder="e.g. Jazz Piano Improvisation" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Date</label>
                            <input type="text" id="ws-date" required placeholder="e.g. Nov 10, 2026" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Price (RM)</label>
                            <input type="number" id="ws-price" required value="100" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div class="flex items-center gap-2 pt-1">
                            <input type="checkbox" id="ws-exclusive" class="w-4 h-4 text-indigo-600 rounded">
                            <label for="ws-exclusive" class="font-bold text-slate-700">Exclusive (Crescendo/Virtuoso Tiers Only)</label>
                        </div>
                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition">Publish Workshop</button>
                    </form>
                </div>

                <!-- Workshop List & Attendees -->
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                    <h2 class="text-base font-bold text-slate-800 border-b pb-3">📅 Active Workshops & Registered Students</h2>
                    <div id="admin-workshops-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- TAB 3: VOUCHER APPROVALS -->
        <div id="admin-content-vouchers" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                <h2 class="text-base font-bold text-slate-800 border-b pb-3">🎁 Pending Voucher Claims</h2>
                <div id="admin-vouchers-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- TAB 4: TRANSACTIONS -->
        <div id="admin-content-transactions" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                <h2 class="text-base font-bold text-slate-800 border-b pb-3">📜 Complete System Audit & Transactions Log</h2>
                <div id="admin-transactions-list" class="space-y-2 text-xs"></div>
            </div>
        </div>
    </div>

    <script>
        function getData() {
            let data = JSON.parse(localStorage.getItem('expressivo_data_v9'));
            if (!data) {
                data = { 
                    students: [
                        { name: 'Alex Tan', family: 'family_1', contact: '+6012-8889999', dob: '2015-05-12' },
                        { name: 'Emma Tan', family: 'family_1', contact: '+6012-8889999', dob: '2017-08-20' },
                        { name: 'Lucas Lee', family: 'family_2', contact: '+6017-3334444', dob: '2014-01-05' }
                    ],
                    familyWallets: {
                        'family_1': { wallet: 550.00, stars: 150, tier: 'Prelude' },
                        'family_2': { wallet: 850.00, stars: 1200, tier: 'Crescendo' }
                    },
                    claimedVouchers: [
                        { id: 901, title: 'RM5 Off Workshop', cost: 100, claimedBy: 'Alex Tan', family: 'family_1', status: 'Pending Verification' }
                    ], 
                    workshops: [
                        { id: 101, title: "Masterclass Piano Technique", price: 88, exclusive: false, date: "Oct 15, 2026", registered: ['Alex Tan'] },
                        { id: 102, title: "Advanced Violin Masterclass", price: 150, exclusive: true, date: "Oct 22, 2026", registered: ['Emma Tan'] }
                    ],
                    transactions: [
                        { date: '2026-09-28', student: 'Alex Tan', family: 'family_1', desc: 'Registered for Piano Technique Workshop', amount: '- RM 88.00', starsChange: '+15 ⭐' }
                    ]
                };
                localStorage.setItem('expressivo_data_v9', JSON.stringify(data));
            }
            return data;
        }

        function saveData(data) {
            localStorage.setItem('expressivo_data_v9', JSON.stringify(data));
            updateAdminUI();
        }

        function resetSystemData() {
            if (confirm('Are you sure you want to reset all demo data to default?')) {
                localStorage.removeItem('expressivo_data_v9');
                location.reload();
            }
        }

        function switchAdminTab(tab) {
            ['students', 'workshops', 'vouchers', 'transactions'].forEach(t => {
                document.getElementById(`admin-content-${t}`).classList.add('hidden');
                document.getElementById(`admin-tab-${t}`).className = "px-4 py-2 bg-slate-100 text-slate-600 rounded-lg whitespace-nowrap";
            });
            document.getElementById(`admin-content-${tab}`).classList.remove('hidden');
            document.getElementById(`admin-tab-${tab}`).className = "px-4 py-2 bg-slate-900 text-white rounded-lg whitespace-nowrap";
        }

        function handleAddNewStudent(e) {
            e.preventDefault();
            const name = document.getElementById('new-student-name').value.trim();
            const family = document.getElementById('new-family-id').value.trim();
            const contact = document.getElementById('new-student-contact').value.trim();
            const tier = document.getElementById('new-family-tier').value;
            const wallet = parseFloat(document.getElementById('new-family-wallet').value) || 0;

            const data = getData();
            
            // Add student
            data.students.push({ name, family, contact, dob: '2016-01-01' });

            // Setup family wallet if not exists
            if (!data.familyWallets[family]) {
                data.familyWallets[family] = { wallet: wallet, stars: 50, tier: tier };
            } else {
                data.familyWallets[family].wallet += wallet;
            }

            // Log transaction
            data.transactions.unshift({
                date: new Date().toISOString().split('T')[0],
                student: name,
                family: family,
                desc: `Admin registered student & added initial wallet credit`,
                amount: `+ RM ${wallet.toFixed(2)}`,
                starsChange: '+50 ⭐'
            });

            saveData(data);
            alert(`Student "${name}" successfully registered under family "${family}"! Parent portal link ready.`);
            e.target.reset();
        }

        function handleCreateWorkshop(e) {
            e.preventDefault();
            const title = document.getElementById('ws-title').value.trim();
            const date = document.getElementById('ws-date').value.trim();
            const price = parseFloat(document.getElementById('ws-price').value) || 0;
            const exclusive = document.getElementById('ws-exclusive').checked;

            const data = getData();
            data.workshops.push({
                id: Date.now(),
                title,
                date,
                price,
                exclusive,
                registered: []
            });

            saveData(data);
            alert(`Workshop "${title}" published successfully!`);
            e.target.reset();
        }

        function approveVoucher(vId) {
            const data = getData();
            const v = data.claimedVouchers.find(item => item.id === vId);
            if (v) {
                v.status = 'Approved & Applied';
                data.transactions.unshift({
                    date: new Date().toISOString().split('T')[0],
                    student: v.claimedBy,
                    family: v.family,
                    desc: `Voucher Approved: ${v.title}`,
                    amount: 'RM 0.00',
                    starsChange: `-${v.cost} ⭐`
                });
                saveData(data);
            }
        }

        function adjustWallet(familyKey) {
            const amountStr = prompt('Enter amount to add (positive) or deduct (negative) for family wallet:', '50');
            if (amountStr === null) return;
            const amount = parseFloat(amountStr);
            if (isNaN(amount)) {
                alert('Invalid amount');
                return;
            }

            const data = getData();
            if (data.familyWallets[familyKey]) {
                data.familyWallets[familyKey].wallet += amount;
                data.transactions.unshift({
                    date: new Date().toISOString().split('T')[0],
                    student: 'Family Admin',
                    family: familyKey,
                    desc: `Admin manual wallet adjustment`,
                    amount: `${amount >= 0 ? '+' : ''} RM ${amount.toFixed(2)}`,
                    starsChange: '0 ⭐'
                });
                saveData(data);
                alert('Wallet updated successfully!');
            }
        }

        function updateAdminUI() {
            const data = getData();

            // 1. Students & Families list
            const studentsContainer = document.getElementById('admin-students-list');
            const uniqueFamilies = [...new Set(data.students.map(s => s.family))];

            studentsContainer.innerHTML = uniqueFamilies.map(famKey => {
                const famStudents = data.students.filter(s => s.family === famKey);
                const famWallet = data.familyWallets[famKey] || { wallet: 0, stars: 0, tier: 'Prelude' };
                
                const parentLink = `index.html?student=${encodeURIComponent(famStudents[0]?.name || '')}`;

                return `
                    <div class="bg-slate-50 p-4 rounded-xl border space-y-3">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b pb-2">
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm">Family Group: <span class="text-indigo-600">${famKey}</span></h3>
                                <p class="text-xs text-slate-500">Tier: <span class="font-semibold text-slate-700">${famWallet.tier}</span> | Wallet: <span class="font-bold text-emerald-600">RM ${famWallet.wallet.toFixed(2)}</span> | Stars: <span class="font-bold text-amber-600">${famWallet.stars} ⭐</span></p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="adjustWallet('${famKey}')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg text-xs transition">Adjust Wallet</button>
                                <a href="${parentLink}" target="_blank" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-xs transition inline-block">Open Parent Portal ↗</a>
                            </div>
                        </div>
                        <div class="text-xs space-y-1">
                            <p class="font-bold text-slate-400 uppercase tracking-wider text-[10px]">Registered Siblings:</p>
                            <div class="flex flex-wrap gap-2">
                                ${famStudents.map(s => `<span class="px-2.5 py-1 bg-white border rounded-lg text-slate-700 font-medium">${s.name} (${s.contact})</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 2. Workshops list
            const wsContainer = document.getElementById('admin-workshops-list');
            wsContainer.innerHTML = data.workshops.length === 0 ? `<p class="text-xs text-slate-400 italic">No workshops scheduled.</p>` :
                data.workshops.map(w => `
                    <div class="bg-slate-50 p-4 rounded-xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
                        <div>
                            <h4 class="font-bold text-slate-800 text-sm">${w.title} ${w.exclusive ? '<span class="text-amber-600">⭐ Exclusive</span>' : ''}</h4>
                            <p class="text-slate-500">Date: ${w.date} | Price: RM ${w.price}</p>
                            <p class="text-slate-600 mt-1">Registered (${w.registered.length}): <span class="font-semibold">${w.registered.join(', ') || 'None yet'}</span></p>
                        </div>
                    </div>
                `).join('');

            // 3. Vouchers list
            const vContainer = document.getElementById('admin-vouchers-list');
            const pendingVouchers = data.claimedVouchers.filter(v => v.status === 'Pending Verification');
            vContainer.innerHTML = pendingVouchers.length === 0 ? `<p class="text-xs text-slate-400 italic">No pending voucher claims to verify.</p>` :
                pendingVouchers.map(v => `
                    <div class="bg-slate-50 p-4 rounded-xl border flex justify-between items-center text-xs">
                        <div>
                            <h4 class="font-bold text-slate-800">${v.title}</h4>
                            <p class="text-slate-500">Claimed by: <span class="font-semibold text-slate-700">${v.claimedBy}</span> (Family: ${v.family}) | Cost: <span class="text-amber-600 font-bold">${v.cost} Stars</span></p>
                        </div>
                        <button onclick="approveVoucher(${v.id})" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition">Approve Claim</button>
                    </div>
                `).join('');

            // 4. Transactions Audit Log
            const txContainer = document.getElementById('admin-transactions-list');
            txContainer.innerHTML = (data.transactions || []).map(t => `
                <div class="bg-slate-50 p-3 rounded-xl border flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold text-slate-800">${t.desc} <span class="text-indigo-600">(${t.student} / ${t.family})</span></p>
                        <p class="text-slate-400 text-[10px]">${t.date}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-bold ${t.amount && t.amount.startsWith('-') ? 'text-rose-600' : 'text-emerald-600'}">${t.amount}</p>
                        <p class="text-amber-600 text-[10px] font-bold">${t.starsChange}</p>
                    </div>
                </div>
            `).join('');
        }

        updateAdminUI();
    </script>
</body>
</html>
