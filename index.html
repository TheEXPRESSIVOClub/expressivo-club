<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expressivo Club - Parent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, getDocs, updateDoc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDHvyRDPEG9jzFbqSTuKmTjvnRDShmN6uU",
            authDomain: "expressivo-club.firebaseapp.com",
            projectId: "expressivo-club",
            storageBucket: "expressivo-club.firebasestorage.app",
            messagingSenderId: "562055940468",
            appId: "1:562055940468:web:6691f8ad3a87954d660421"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.portalData = { student: null, family: null, siblings: [], workshops: [], transactions: [] };

        async function initPortal() {
            const urlParams = new URLSearchParams(window.location.search);
            const studentName = urlParams.get('student');

            // Listen to Students
            onSnapshot(collection(db, "students"), (snapshot) => {
                const students = [];
                snapshot.forEach(d => students.push({ id: d.id, ...d.data() }));
                
                let found = students.find(s => s.name.toLowerCase() === (studentName || '').toLowerCase());
                if (!found && students.length > 0) found = students[0];

                if (found) {
                    window.portalData.student = found;
                    window.portalData.siblings = students.filter(s => s.family === found.family);

                    // Listen to Family Wallet
                    onSnapshot(doc(db, "families", found.family), (famSnap) => {
                        window.portalData.family = famSnap.exists() ? famSnap.data() : { wallet: 0, stars: 0, tier: 'Prelude' };
                        updatePortalUI();
                    });
                }
            });

            // Listen to Workshops
            onSnapshot(collection(db, "workshops"), (snapshot) => {
                window.portalData.workshops = [];
                snapshot.forEach(d => window.portalData.workshops.push({ id: d.id, ...d.data() }));
                updatePortalUI();
            });

            // Listen to Transactions
            onSnapshot(collection(db, "transactions"), (snapshot) => {
                window.portalData.transactions = [];
                snapshot.forEach(d => window.portalData.transactions.push({ id: d.id, ...d.data() }));
                updatePortalUI();
            });
        }

        window.claimVoucher = async function(title, cost) {
            const data = window.portalData;
            if (!data.family || data.family.stars < cost) {
                alert('Insufficient star balance.');
                return;
            }

            try {
                // Deduct stars
                const newStars = data.family.stars - cost;
                await updateDoc(doc(db, "families", data.student.family), { stars: newStars });

                // Add Voucher
                await addDoc(collection(db, "vouchers"), {
                    title: title,
                    cost: cost,
                    claimedBy: data.student.name,
                    family: data.student.family,
                    status: 'Pending Verification'
                });

                // Add Transaction
                await addDoc(collection(db, "transactions"), {
                    date: new Date().toISOString().split('T')[0],
                    student: data.student.name,
                    family: data.student.family,
                    desc: `Claimed Voucher: ${title}`,
                    amount: 'RM 0.00',
                    starsChange: `-${cost} ⭐`
                });

                alert(`Voucher "${title}" claimed successfully!`);
            } catch (err) {
                console.error("Error claiming voucher: ", err);
            }
        };

        window.registerWorkshop = async function(wId) {
            const data = window.portalData;
            const ws = data.workshops.find(w => w.id === wId);
            if (!ws) return;

            const registeredList = ws.registered || [];
            if (registeredList.includes(data.student.name)) {
                alert('Already registered for this workshop!');
                return;
            }

            try {
                registeredList.push(data.student.name);
                await updateDoc(doc(db, "workshops", wId), { registered: registeredList });

                const currentStars = data.family.stars || 0;
                await updateDoc(doc(db, "families", data.student.family), { stars: currentStars + 15 });

                await addDoc(collection(db, "transactions"), {
                    date: new Date().toISOString().split('T')[0],
                    student: data.student.name,
                    family: data.student.family,
                    desc: `Registered for Workshop: ${ws.title}`,
                    amount: `- RM ${Number(ws.price).toFixed(2)}`,
                    starsChange: '+15 ⭐'
                });

                alert(`Registered successfully for ${ws.title}! (+15 Stars earned)`);
            } catch (err) {
                console.error("Error registering workshop: ", err);
            }
        };

        initPortal();
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 sm:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-slate-900 text-white p-6 rounded-2xl shadow-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold" id="header-student-title">🎹 Welcome!</h1>
                <p class="text-xs text-slate-400 mt-1">Expressivo Club - Family Member Portal (Live)</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Membership Tier</p>
                    <p class="text-sm font-extrabold text-indigo-400" id="header-tier">Prelude</p>
                </div>
                <div class="flex items-center gap-3 bg-indigo-600/40 border border-indigo-500/50 px-4 py-2 rounded-xl">
                    <div>
                        <p class="text-[10px] text-indigo-200 uppercase tracking-wider font-bold">Family Star Balance</p>
                        <p class="text-xl font-extrabold text-amber-300" id="header-stars">0 ⭐</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex bg-white p-2 rounded-xl shadow-sm border space-x-2 text-xs sm:text-sm font-semibold overflow-x-auto">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-4 py-2 bg-slate-900 text-white rounded-lg whitespace-nowrap">🏠 Dashboard</button>
            <button onclick="switchTab('rewards')" id="tab-rewards" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg whitespace-nowrap">🎁 Rewards & Vouchers</button>
            <button onclick="switchTab('workshops')" id="tab-workshops" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg whitespace-nowrap">📅 Workshops & Events</button>
        </div>

        <!-- TAB 1: DASHBOARD -->
        <div id="content-dashboard" class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-2">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Family Credit Wallet</p>
                    <p class="text-3xl font-extrabold text-slate-800" id="family-wallet-balance">RM 0.00</p>
                    <p class="text-xs text-slate-500">Shared balance for tuition & materials.</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-2">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Siblings in Family</p>
                    <div id="family-siblings-list" class="flex flex-wrap gap-2 pt-1"></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-3">
                <h3 class="text-sm font-bold text-slate-800 border-b pb-3">📜 Family & Student Transaction History</h3>
                <div id="parent-transaction-history" class="space-y-2 text-xs"></div>
            </div>
        </div>

        <!-- TAB 2: REWARDS -->
        <div id="content-rewards" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                <h2 class="text-lg font-bold text-slate-800 border-b pb-3">Redeem Vouchers with Stars</h2>
                <div id="rewards-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
        </div>

        <!-- TAB 3: WORKSHOPS -->
        <div id="content-workshops" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                <h2 class="text-lg font-bold text-slate-800 border-b pb-3">Upcoming Workshops</h2>
                <div id="parent-workshops-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            ['dashboard', 'rewards', 'workshops'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "px-4 py-2 bg-slate-100 text-slate-600 rounded-lg whitespace-nowrap";
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "px-4 py-2 bg-slate-900 text-white rounded-lg whitespace-nowrap";
        }

        function updatePortalUI() {
            const data = window.portalData;
            if (!data.student) return;

            const fam = data.family || { wallet: 0, stars: 0, tier: 'Prelude' };

            document.getElementById('header-student-title').innerText = `🎹 Welcome, ${data.student.name}!`;
            document.getElementById('header-stars').innerText = `${fam.stars || 0} ⭐`;
            document.getElementById('header-tier').innerText = `${fam.tier || 'Prelude'} Tier`;
            document.getElementById('family-wallet-balance').innerText = `RM ${Number(fam.wallet || 0).toFixed(2)}`;

            // Siblings
            document.getElementById('family-siblings-list').innerHTML = data.siblings.map(s => `
                <span class="px-3 py-1 border text-xs font-bold rounded-lg ${s.name === data.student.name ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'bg-slate-100 text-slate-700'}">${s.name}</span>
            `).join('');

            // Transactions
            const familyTx = data.transactions.filter(t => t.family === data.student.family || t.student === data.student.name);
            document.getElementById('parent-transaction-history').innerHTML = familyTx.length === 0 ?
                `<p class="text-slate-400 italic">No transaction history yet.</p>` :
                familyTx.map(t => `
                    <div class="bg-slate-50 p-3 rounded-xl border flex justify-between items-center text-xs">
                        <div>
                            <p class="font-bold text-slate-800">${t.desc} <span class="text-slate-500 font-normal">(${t.student})</span></p>
                            <p class="text-slate-400 text-[10px]">${t.date}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold ${t.amount && t.amount.startsWith('-') ? 'text-rose-600' : 'text-emerald-600'}">${t.amount || 'RM 0.00'}</p>
                            <p class="text-amber-600 text-[10px] font-bold">${t.starsChange || ''}</p>
                        </div>
                    </div>
                `).join('');

            // Rewards
            const rewards = [
                { title: "RM5 Off Workshop", cost: 100 },
                { title: "RM10 Off Workshop", cost: 200 },
                { title: "RM20 Off Workshop", cost: 400 },
                { title: "50% Off Workshop", cost: 600 }
            ];
            document.getElementById('rewards-list').innerHTML = rewards.map(r => `
                <div class="bg-slate-50 p-4 rounded-xl border flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">${r.title}</h4>
                        <p class="text-xs text-amber-600 font-semibold">${r.cost} Stars</p>
                    </div>
                    <button onclick="claimVoucher('${r.title}', ${r.cost})" class="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl hover:bg-indigo-700 transition">Redeem</button>
                </div>
            `).join('');

            // Workshops
            document.getElementById('parent-workshops-list').innerHTML = data.workshops.length === 0 ?
                `<p class="text-slate-400 italic text-xs">No upcoming workshops scheduled.</p>` :
                data.workshops.map(w => {
                    const isReg = (w.registered || []).includes(data.student.name);
                    return `
                        <div class="bg-slate-50 p-4 rounded-xl border flex justify-between items-center text-xs">
                            <div>
                                <h4 class="font-bold text-slate-800">${w.title}</h4>
                                <p class="text-slate-500">Date: ${w.date} | Price: RM ${w.price}</p>
                            </div>
                            <div>
                                ${isReg ? `<span class="px-3 py-1 bg-emerald-100 text-emerald-700 font-bold rounded-lg">Registered ✓</span>` :
                                `<button onclick="registerWorkshop('${w.id}')" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition">Book Workshop</button>`}
                            </div>
                        </div>
                    `;
                }).join('');
        }
    </script>
</body>
</html>
